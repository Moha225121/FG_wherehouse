name: fg-wherehouse
region: fra # Frankfurt, change if needed
services:
- name: web
  instance_count: 1
  instance_size_slug: basic-xxs
  image:
    deploy_on_push: true
  http_port: 8080
  build_command: |
    composer install --no-dev --optimize-autoloader
    npm install
    npm run build
  run_command: |
    php artisan migrate --force
    apache2-foreground # or heroku-php-apache2 public/
  envs:
  - key: APP_ENV
    scope: RUN_AND_BUILD_TIME
    value: production
  - key: APP_DEBUG
    scope: RUN_TIME
    value: "false"
  - key: APP_KEY
    scope: RUN_TIME
    type: SECRET
  - key: DB_CONNECTION
    scope: RUN_TIME
    value: mysql
databases:
- engine: MYSQL
  name: db
  size: db-s-dev-database
  version: "8"
